name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  # 'releases' is NOT a valid fine-grained permission scope (that's a
  # classic OAuth scope). In the fine-grained model, creating a release
  # is a 'contents' write — so the GITHUB_TOKEN needs contents:write.
  contents: write
  actions: read

# Every xcodebuild needs -skipPackagePluginValidation (SwiftTerm's build-tool
# plugin fails validation on Xcode 26 before anything compiles; see CLAUDE.md).
#
# Signing status:
#   iOS  — the ad-hoc archive/export only succeeds when the runner has a
#          signing identity; it is allowed to fail so the Mac artifacts still ship.
#   Mac  — PocketTmux.app and pockettmuxd are built UNSIGNED (CODE_SIGNING_ALLOWED=NO).
#          Gatekeeper will block the first launch: users right-click → Open (or
#          `xattr -d com.apple.quarantine`). Once a Developer ID certificate is
#          added as a repository secret, replace the CODE_SIGN_* overrides with
#          a proper sign + notarize step.

jobs:
  release:
    name: Archive, package & publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      # ---------------------------------------------------------------- iOS
      - name: Archive iPhone app (ad-hoc)
        id: archive
        working-directory: App
        continue-on-error: true
        run: |
          xcodebuild \
            -project PocketTmux.xcodeproj \
            -scheme PocketTmux \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PocketTmux.xcarchive \
            -skipPackagePluginValidation \
            archive

      - name: Export .ipa
        id: export
        working-directory: App
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/PocketTmux.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build

      # ---------------------------------------------------------------- macOS
      - name: Build PocketTmux for Mac (Release, unsigned)
        id: mac
        working-directory: App
        continue-on-error: true
        run: |
          xcodebuild build \
            -project PocketTmux.xcodeproj \
            -scheme PocketTmuxMac \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/Mac \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO
          ditto -c -k --keepParent \
            build/Mac/Build/Products/Release/PocketTmux.app \
            "build/PocketTmux-macOS-${GITHUB_REF_NAME}.zip"

      - name: Build pockettmuxd (Release, unsigned)
        id: daemon
        working-directory: App
        continue-on-error: true
        run: |
          xcodebuild build \
            -project PocketTmux.xcodeproj \
            -scheme pockettmuxd \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/Daemon \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO
          tar -czf "build/pockettmuxd-${GITHUB_REF_NAME}.tar.gz" \
            -C build/Daemon/Build/Products/Release pockettmuxd

      # ---------------------------------------------------------------- publish
      - name: List artifacts
        working-directory: App
        run: ls -lh build/*.ipa build/*.zip build/*.tar.gz 2>/dev/null || echo "(no artifacts — check the build steps)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PocketTmux-${{ github.ref_name }}
          path: |
            App/build/*.ipa
            App/build/*.zip
            App/build/*.tar.gz
          if-no-files-found: warn

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use this tag's changelog section as the release notes (fall back to a header).
          NOTES_FILE=$(mktemp)
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## \\["tag"]" { in_block = 1; print; next }
            in_block && $0 ~ "^## \\[" { in_block = 0 }
            in_block { print }
          ' CHANGELOG.md > "$NOTES_FILE" || true
          if [ ! -s "$NOTES_FILE" ]; then
            printf 'Release %s\n' "${GITHUB_REF_NAME}" > "$NOTES_FILE"
          fi
          {
            printf '\n### Downloads\n'
            printf -- '- `PocketTmux-macOS-*.zip` — Mac menu-bar app (unsigned: right-click → Open on first launch)\n'
            printf -- '- `pockettmuxd-*.tar.gz` — headless agent binary (unsigned)\n'
            printf -- '- `*.ipa` — iPhone app, ad-hoc signed (only present when the runner could sign)\n'
          } >> "$NOTES_FILE"

          # Attach whatever the build steps produced.
          ASSETS=()
          for f in App/build/*.ipa App/build/*.zip App/build/*.tar.gz; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          gh release create "${GITHUB_REF_NAME}" \
            --title "PocketTmux ${GITHUB_REF_NAME#v}" \
            --notes-file "$NOTES_FILE" \
            "${ASSETS[@]}" || true
