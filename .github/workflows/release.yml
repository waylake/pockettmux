name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  # 'releases' is NOT a valid fine-grained permission scope (that's a
  # classic OAuth scope). In the fine-grained model, creating a release
  # is a 'contents' write — so the GITHUB_TOKEN needs contents:write.
  contents: write
  actions: read

# Runner: macos-26 is the only image with Xcode 26.x, which the app requires
# (isolated `@MainActor` conformances, Sendable CIContext — Xcode 16.4 on
# macos-15 fails with "unknown attribute 'MainActor'"). Every xcodebuild needs
# -skipPackagePluginValidation (SwiftTerm's build-tool plugin fails validation
# on Xcode 26 before anything compiles; see CLAUDE.md).
#
# Signing status:
#   iOS  — the ad-hoc archive/export only succeeds when the runner has a
#          signing identity; it is allowed to fail so the Mac artifacts still ship.
#   Mac  — PocketTmux.app and pockettmuxd are built UNSIGNED (CODE_SIGNING_ALLOWED=NO).
#          Gatekeeper will block the first launch: users right-click → Open (or
#          `xattr -d com.apple.quarantine`). Once a Developer ID certificate is
#          added as a repository secret, replace the CODE_SIGN_* overrides with
#          a proper sign + notarize step.

jobs:
  release:
    name: Archive, package & publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      # ---------------------------------------------------------------- iOS
      # No Developer ID / provisioning profile on the runner, so the archive is
      # built unsigned and packaged as an .ipa by hand (`xcodebuild
      # -exportArchive` insists on a signing identity). Users re-sign it with
      # their own Apple ID (Sideloadly, AltStore, `codesign`) or build from
      # Xcode; the Mac artifacts are unsigned for the same reason.
      - name: Archive iPhone app (unsigned)
        id: archive
        working-directory: App
        run: |
          xcodebuild \
            -project PocketTmux.xcodeproj \
            -scheme PocketTmux \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PocketTmux.xcarchive \
            -skipPackagePluginValidation \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        working-directory: App
        run: |
          mkdir -p build/Payload
          cp -R build/PocketTmux.xcarchive/Products/Applications/PocketTmux.app build/Payload/
          (cd build && zip -qry "PocketTmux-iOS-${GITHUB_REF_NAME}-unsigned.ipa" Payload)
          unzip -l "build/PocketTmux-iOS-${GITHUB_REF_NAME}-unsigned.ipa" | tail -1

      # ---------------------------------------------------------------- macOS
      - name: Build PocketTmux for Mac (Release, unsigned)
        id: mac
        working-directory: App
        run: |
          xcodebuild build \
            -project PocketTmux.xcodeproj \
            -scheme PocketTmuxMac \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/Mac \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO
          ditto -c -k --keepParent \
            build/Mac/Build/Products/Release/PocketTmux.app \
            "build/PocketTmux-macOS-${GITHUB_REF_NAME}.zip"

      - name: Build pockettmuxd (Release, unsigned)
        id: daemon
        working-directory: App
        run: |
          xcodebuild build \
            -project PocketTmux.xcodeproj \
            -scheme pockettmuxd \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/Daemon \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO
          tar -czf "build/pockettmuxd-${GITHUB_REF_NAME}.tar.gz" \
            -C build/Daemon/Build/Products/Release pockettmuxd

      # ---------------------------------------------------------------- publish
      - name: List artifacts
        working-directory: App
        run: ls -lh build/*.ipa build/*.zip build/*.tar.gz 2>/dev/null || echo "(no artifacts — check the build steps)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PocketTmux-${{ github.ref_name }}
          path: |
            App/build/*.ipa
            App/build/*.zip
            App/build/*.tar.gz
          if-no-files-found: warn

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use this tag's changelog section as the release notes. CHANGELOG
          # headings carry no `v` prefix (`## [1.0.0] - …`), the tag does.
          NOTES_FILE=$(mktemp)
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v tag="$VERSION" '
            $0 ~ "^## \\["tag"\\]" { in_block = 1; print; next }
            in_block && $0 ~ "^## \\[" { in_block = 0 }
            in_block { print }
          ' CHANGELOG.md > "$NOTES_FILE" || true
          if [ ! -s "$NOTES_FILE" ]; then
            printf 'Release %s\n' "${GITHUB_REF_NAME}" > "$NOTES_FILE"
          fi
          {
            printf '\n### Downloads\n'
            printf -- '- `PocketTmux-macOS-*.zip` — Mac menu-bar app (unsigned: right-click → Open on first launch)\n'
            printf -- '- `pockettmuxd-*.tar.gz` — headless agent binary (unsigned)\n'
            printf -- '- `PocketTmux-iOS-*-unsigned.ipa` — iPhone app, **unsigned**: re-sign with your own Apple ID (Sideloadly / AltStore / `codesign`) or build the `PocketTmux` scheme from Xcode\n'
          } >> "$NOTES_FILE"

          # Attach whatever the build steps produced.
          ASSETS=()
          for f in App/build/*.ipa App/build/*.zip App/build/*.tar.gz; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          echo "attaching ${#ASSETS[@]} asset(s)"

          # Idempotent: a re-run of the same tag refreshes notes and assets
          # instead of failing on "release already exists". Failures are NOT
          # swallowed — a release job that publishes nothing must go red.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "PocketTmux ${GITHUB_REF_NAME#v}" \
              --notes-file "$NOTES_FILE"
            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
            fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "PocketTmux ${GITHUB_REF_NAME#v}" \
              --notes-file "$NOTES_FILE" \
              "${ASSETS[@]}"
          fi
