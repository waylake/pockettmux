name: ✨ Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What pain does this solve? Which phase of the roadmap (P0–P3) does it belong to?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: priority
    attributes:
      label: Priority (your view)
      options:
        - nice-to-have
        - should-have
        - must-have-for-v1
